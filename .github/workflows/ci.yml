name: CI

# Uses `pull_request` (not `pull_request_target`): forked PRs run with a
# read-only token and no access to secrets. No step interpolates any
# attacker-controlled `github.event.*` value into a shell command.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # epic-fab holds Epic OAuth tokens and must never bind a port.
      # See SECURITY.md for why, and what a local UI would have to satisfy.
      - name: No network listener
        run: bun run guard
