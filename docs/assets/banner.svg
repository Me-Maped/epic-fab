<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" role="img" aria-label="Epic-Fab — Best of both — Epic Games library + Linux-native CLI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1c1f25"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8ac1ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Monaco, "Courier New", monospace; }
      .tag  { font-size: 22px; fill: #8b949e; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g opacity="0.12">
    <line x1="0" y1="40"  x2="1200" y2="40"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="1200" y2="80"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="120"  x2="1200" y2="120"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="160"  x2="1200" y2="160"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="200"  x2="1200" y2="200"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="240"  x2="1200" y2="240"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="280"  x2="1200" y2="280"  stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <image href="./docs/assets/epicgames-logo.svg" x="130" y="60" width="360" height="100" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="600" cy="110" r="6" fill="#58a6ff"/>
  <image href="./docs/assets/fab-logo.svg" x="710" y="60" width="360" height="100" preserveAspectRatio="xMidYMid meet"/>

  <rect x="130" y="220" width="940" height="2" fill="url(#accentLine)"/>

  <text x="600" y="262" class="mono tag" text-anchor="middle">Best of both — Epic Games library + Linux-native CLI.</text>
</svg>
