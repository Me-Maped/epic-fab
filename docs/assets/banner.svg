<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="epic-fab — your Epic library, on Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Monaco, "Courier New", monospace; }
      .word { font-weight: 700; font-size: 120px; letter-spacing: -2px; }
      .dash { fill: #f0883e; }
      .tag  { font-size: 22px; fill: #8b949e; letter-spacing: 1px; }
      .prompt { fill: #7ee787; font-size: 80px; }
      .cursor { fill: #58a6ff; }
      @keyframes blink { 50% { opacity: 0; } }
      .blink { animation: blink 1.06s steps(1) infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <g opacity="0.12">
    <line x1="0" y1="40"  x2="1200" y2="40"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="1200" y2="80"  stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <text x="80" y="180" class="mono prompt">$</text>
  <text x="150" y="180" class="mono word" fill="#e6edf3">epic<tspan class="dash">-</tspan>fab</text>
  <rect class="cursor blink" x="900" y="100" width="22" height="100" rx="2"/>

  <rect x="80" y="220" width="940" height="2" fill="url(#accentLine)"/>

  <text x="80" y="262" class="mono tag">your Epic Games library, on Linux. no launcher. no wine. no windows.</text>
</svg>
